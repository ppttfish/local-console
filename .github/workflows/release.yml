name: Release

# 触发条件：v* tag 推送
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 也允许手动触发（Settings → Actions → Run workflow）

permissions:
  contents: write  # 推 release 要写权限

jobs:
  build:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true  # 历史 typecheck 错误不阻塞发版

      - name: Build (electron-vite)
        run: npm run build

      # nsis 给安装版自动升级（latest.yml 指向 setup.exe）；portable 给绿色版用户。
      # winCodeSign 符号链接 bug 仅存在于本机非管理员 shell，runner 上一直正常。
      # 注意：CLI 目标参数会覆盖 package.json 的 win.target，两处需保持一致
      - name: Dist (nsis + portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish always

      # electron-builder 跑 publish always 会自动把 latest.yml + 安装包上传到 release
      # 兜底仅在 tag 构建时有意义（dispatch 触发时 github.ref 是分支，softprops 拿不到 tag）
      - name: Upload artifacts (fallback)
        if: always() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/latest*.yml
            dist/*.exe
            dist/*.blockmap
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false

  release-mac:
    name: Build & Release (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build (electron-vite)
        run: npm run build

      # identity 为 null（package.json build.mac），跳过 Apple 签名出未签名包；
      # zip + latest-mac.yml 是 electron-updater 在 darwin 上自动更新的配套产物。
      # better-sqlite3 由 electron-builder 在 runner 上按 darwin 自动重编，无需额外步骤
      - name: Dist (dmg + zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always

      - name: Upload artifacts (fallback)
        if: always() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/latest-mac.yml
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          fail_on_unmatched_files: false
          draft: false
